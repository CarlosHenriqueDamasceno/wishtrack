version: '3.7'
services:
  database:
    image: mysql/mysql-server:8.0
    ports:
        - '3306:3306'
    environment:
        MYSQL_ROOT_PASSWORD: 'admin'
        MYSQL_DATABASE: 'wishtrack'
        MYSQL_USER: 'admin'
        MYSQL_PASSWORD: 'admin'
    volumes:
        - 'database:/var/lib/mysql'
volumes:
  database: